version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    command: /bin/sh -c "while sleep 1000; do :; done"
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://sphr_user:sphr_password@db:5432/sphr_db
      - DENO_DIR=/workspace/.deno_cache
    networks:
      - sphr-network

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      - POSTGRES_USER=sphr_user
      - POSTGRES_PASSWORD=sphr_password
      - POSTGRES_DB=sphr_db
    ports:
      - "5432:5432"
    networks:
      - sphr-network

volumes:
  postgres-data:

networks:
  sphr-network:
    driver: bridge
