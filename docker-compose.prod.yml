version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://sphr_user:${POSTGRES_PASSWORD}@db:5432/sphr_db
      - PORT=8000
    networks:
      - sphr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      - POSTGRES_USER=sphr_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=sphr_db
    networks:
      - sphr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sphr_user -d sphr_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: postgres:15-alpine
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh
    environment:
      - POSTGRES_USER=sphr_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=sphr_db
      - PGHOST=db
      - BACKUP_RETENTION_DAYS=30
    networks:
      - sphr-network
    entrypoint: /bin/sh
    command: -c "chmod +x /backup.sh && crond -f -l 2"

volumes:
  postgres-data:
    driver: local

networks:
  sphr-network:
    driver: bridge
